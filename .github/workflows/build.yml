name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore -r win-x64 --locked-mode
      - run: dotnet build src/RetroPadMapper/RetroPadMapper.csproj -c Release -r win-x64 --no-restore
