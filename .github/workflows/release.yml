name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/RetroPadMapper/RetroPadMapper.csproj -c Release -r win-x64 --self-contained false -o artifacts/RetroPadMapper-win-x64
      - shell: pwsh
        run: |
          $selfTest = Start-Process 'artifacts/RetroPadMapper-win-x64/RetroPadMapper.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { exit $selfTest.ExitCode }
          $benchmark = Start-Process 'artifacts/RetroPadMapper-win-x64/RetroPadMapper.exe' -ArgumentList '--benchmark','artifacts/benchmark-release' -Wait -PassThru
          if ($benchmark.ExitCode -ne 0) { exit $benchmark.ExitCode }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,README.md artifacts/RetroPadMapper-win-x64/
          Copy-Item -Recurse artifacts/benchmark-release artifacts/RetroPadMapper-win-x64/benchmark-evidence
      - shell: pwsh
        run: Compress-Archive artifacts/RetroPadMapper-win-x64/* artifacts/RetroPadMapper-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/RetroPadMapper-win-x64.zip
